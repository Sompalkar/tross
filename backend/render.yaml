# One-click deploy on Render (https://render.com).
# Secrets are marked `sync: false`, so Render asks for them in the dashboard
# instead of reading them from this file.
services:
  - type: web
    name: linkedin-profile-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MOCK_MODE
        value: "false"
      - key: LINKEDIN_COOKIE
        sync: false
      - key: API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"
